# dsh-usage-guard bundle layer: applied automatically when the package is
# installed as a profile bundle (package.json declares dsh.bundle.patch).
# Override any field in the profile's own cordis.patch.yml or in
# $DSH_HOME/settings.yaml under `dsh-usage-guard:`.
- insert:
    - id: dsh-usage-guard
      name: '@goodandready/dsh-usage-guard'
